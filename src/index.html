<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="robots" content="{{ROBOTS}}">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Commissioner:wght@400;500;600;700&display=swap">
<style>{{CSS}}</style>
</head>
<body>
{{RIBBON}}

<header class="hero">
  <div class="in">
    <h1 id="b-name"></h1>
    <div class="tag" id="b-tag"></div>
    <div class="meta">
      <span id="b-where"></span>
      <span id="b-open"></span>
    </div>
  </div>
</header>

<div class="page">
<main class="wrap" id="flow">

  <div class="progress">
    <div class="track"><i id="bar"></i></div>
    <div class="plab" id="plab" aria-live="polite"></div>
  </div>

  <!-- Крок: заголовок-кнопка + тіло, що згортається. Розгорнутий рівно один,
       пройдені показують у рядку лише те, що обрала людина. -->
  <section class="step" data-step="1">
    <h2 class="step-h">
      <button class="step-btn" type="button" id="h-1" aria-controls="body-1" aria-expanded="true">
        <span class="num">1</span>
        <span class="lab"><span class="ttl">Послуга</span><span class="pick"><span id="p-service"></span></span></span>
        <span class="edit" aria-hidden="true">змінити</span>
      </button>
    </h2>
    <div class="body" id="body-1" role="region" aria-labelledby="h-1">
      <div class="body-in">
        <p class="hint"><span></span></p>
        <div id="services"></div>
      </div>
    </div>
  </section>

  <section class="step" data-step="2">
    <h2 class="step-h">
      <button class="step-btn" type="button" id="h-2" aria-controls="body-2" aria-expanded="false">
        <span class="num">2</span>
        <span class="lab"><span class="ttl" id="unit-title"></span><span class="pick"><span id="p-unit"></span></span></span>
        <span class="edit" aria-hidden="true">змінити</span>
      </button>
    </h2>
    <div class="body" id="body-2" role="region" aria-labelledby="h-2">
      <div class="body-in">
        <p class="hint"><span></span></p>
        <div class="cards" id="units"></div>
      </div>
    </div>
  </section>

  <section class="step" data-step="3">
    <h2 class="step-h">
      <button class="step-btn" type="button" id="h-3" aria-controls="body-3" aria-expanded="false">
        <span class="num">3</span>
        <span class="lab"><span class="ttl">День</span><span class="pick"><span id="p-day"></span></span></span>
        <span class="edit" aria-hidden="true">змінити</span>
      </button>
    </h2>
    <div class="body" id="body-3" role="region" aria-labelledby="h-3">
      <div class="body-in">
        <p class="hint"><span></span></p>
        <div class="chips" id="quick"></div>
        <div class="cal">
          <div class="cal-nav">
            <button class="nav" type="button" id="prev" aria-label="Попередній місяць">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="cal-month" id="month" aria-live="polite"></div>
            <button class="nav" type="button" id="next" aria-label="Наступний місяць">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="wd" id="wd"></div>
          <div class="grid" id="days"></div>
          <div class="legend">
            <span><i class="lg-free"></i>є вільні місця</span>
            <span><i class="lg-none"></i>вільних місць немає</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="step" data-step="4">
    <h2 class="step-h">
      <button class="step-btn" type="button" id="h-4" aria-controls="body-4" aria-expanded="false">
        <span class="num">4</span>
        <span class="lab"><span class="ttl">Час</span><span class="pick"><span id="p-time"></span></span></span>
        <span class="count" id="free-count"></span>
        <span class="edit" aria-hidden="true">змінити</span>
      </button>
    </h2>
    <div class="body" id="body-4" role="region" aria-labelledby="h-4">
      <div class="body-in">
        <p class="hint"><span></span></p>
        <div class="slots" id="slots"></div>
      </div>
    </div>
  </section>

  <section class="step" data-step="5">
    <h2 class="step-h">
      <button class="step-btn" type="button" id="h-5" aria-controls="body-5" aria-expanded="false">
        <span class="num">5</span>
        <span class="lab"><span class="ttl">Ваші дані</span><span class="pick"><span id="p-name"></span></span></span>
        <span class="edit" aria-hidden="true">змінити</span>
      </button>
    </h2>
    <div class="body" id="body-5" role="region" aria-labelledby="h-5">
      <div class="body-in">
        <p class="hint"><span></span></p>
        <div class="fields">
          <div>
            <label for="nm">Ім'я</label>
            <input id="nm" placeholder="Олег" autocomplete="name" enterkeyhint="next">
            <span class="err" id="nm-err" role="alert" hidden><b aria-hidden="true">!</b><span></span></span>
          </div>
          <div>
            <label for="ph">Телефон</label>
            <input id="ph" type="tel" inputmode="tel" placeholder="067 111 22 33" autocomplete="tel" enterkeyhint="done">
            <span class="err" id="ph-err" role="alert" hidden><b aria-hidden="true">!</b><span></span></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="foot">
    <div class="sum" id="sum"></div>
    <button class="go" id="go" type="button" disabled>Записатись</button>
  </section>

</main>

<div class="wrap done" id="done" hidden></div>

<div class="sig" id="sig"></div>
</div>

<script type="module">{{JS}}</script>
</body>
</html>
