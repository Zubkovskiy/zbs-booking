<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="robots" content="{{ROBOTS}}">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Commissioner:wght@400;500;600;700&display=swap">
<style>{{CSS}}</style>
</head>
<body>
{{RIBBON}}

<header class="hero">
  <div class="in">
    <h1 id="b-name"></h1>
    <div class="tag" id="b-tag"></div>
    <div class="meta">
      <span id="b-where"></span>
      <span id="b-open"></span>
    </div>
  </div>
</header>

<div class="page">
<main class="wrap" id="flow">

  <section class="step" data-step="1">
    <div class="step-h"><span class="num">1</span><h2>Послуга</h2><span class="pick" id="p-service">оберіть</span></div>
    <p class="hint"></p>
    <div id="services"></div>
  </section>

  <section class="step" data-step="2">
    <div class="step-h"><span class="num">2</span><h2 id="unit-title"></h2><span class="pick on" id="p-unit"></span></div>
    <p class="hint"></p>
    <div class="cards" id="units"></div>
  </section>

  <section class="step" data-step="3">
    <div class="step-h"><span class="num">3</span><h2>День</h2><span class="pick on" id="p-day"></span></div>
    <p class="hint"></p>
    <div class="chips" id="quick"></div>
    <div class="cal">
      <div class="cal-nav">
        <button class="nav" type="button" id="prev" aria-label="Попередній місяць">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="cal-month" id="month" aria-live="polite"></div>
        <button class="nav" type="button" id="next" aria-label="Наступний місяць">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="wd" id="wd"></div>
      <div class="grid" id="days"></div>
      <div class="legend">
        <span><i class="lg-free"></i>є вільні місця</span>
        <span><i class="lg-none"></i>вільних місць немає</span>
      </div>
    </div>
  </section>

  <section class="step" data-step="4">
    <div class="step-h"><span class="num">4</span><h2>Час</h2><span class="count" id="p-time"></span></div>
    <p class="hint"></p>
    <div class="slots" id="slots"></div>
  </section>

  <section class="step" data-step="5">
    <div class="step-h"><span class="num">5</span><h2>Ваші дані</h2><span class="pick" id="p-name">заповніть</span></div>
    <p class="hint"></p>
    <div class="fields">
      <div>
        <label for="nm">Ім'я</label>
        <input id="nm" placeholder="Олег" autocomplete="name" enterkeyhint="next">
        <span class="err" id="nm-err" role="alert" hidden><b aria-hidden="true">!</b><span></span></span>
      </div>
      <div>
        <label for="ph">Телефон</label>
        <input id="ph" type="tel" inputmode="tel" placeholder="067 111 22 33" autocomplete="tel" enterkeyhint="done">
        <span class="err" id="ph-err" role="alert" hidden><b aria-hidden="true">!</b><span></span></span>
      </div>
    </div>
  </section>

  <section class="foot">
    <div class="sum" id="sum">Оберіть послугу, щоб побачити вільний час.</div>
    <button class="go" id="go" type="button" disabled>Записатись</button>
  </section>

</main>

<div class="wrap done" id="done" hidden></div>

<div class="sig" id="sig"></div>
</div>

<script type="module">{{JS}}</script>
</body>
</html>
