<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="robots" content="{{ROBOTS}}">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600&display=swap">
<style>{{CSS}}</style>
</head>
<body>

<div class="shell">

  <header class="top">
    <div class="brand">
      <span class="logo" id="b-logo" aria-hidden="true"></span>
      <span class="brand-txt">
        <span class="brand-name" id="b-name"></span>
        <span class="brand-sub" id="b-sub"></span>
      </span>
      <a class="call" id="b-call" hidden aria-label="Подзвонити">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>
      </a>
    </div>
    <div class="progress" id="progress">
      <div class="track"><i id="bar"><b></b></i></div>
      <div class="plab" id="plab" aria-live="polite"></div>
    </div>
  </header>

  <!-- Крок — окрема картка. Розгорнутий рівно один; пройдені показують у рядку
       під назвою те, що обрала людина, а поки не обрано — що тут робити. -->
  <main class="flow" id="flow">

    <section class="step" data-step="1">
      <h2 class="step-h">
        <button class="step-btn" type="button" id="h-1" aria-controls="body-1" aria-expanded="true">
          <span class="num">1</span>
          <span class="lab"><span class="ttl">Послуга</span><span class="pick" id="p-service"></span></span>
          <span class="edit" aria-hidden="true">змінити</span>
        </button>
      </h2>
      <div class="body" id="body-1" role="region" aria-labelledby="h-1">
        <div class="body-in"><div class="opts" id="services"></div></div>
      </div>
    </section>

    <section class="step" data-step="2">
      <h2 class="step-h">
        <button class="step-btn" type="button" id="h-2" aria-controls="body-2" aria-expanded="false">
          <span class="num">2</span>
          <span class="lab"><span class="ttl" id="unit-title"></span><span class="pick" id="p-unit"></span></span>
          <span class="edit" aria-hidden="true">змінити</span>
        </button>
      </h2>
      <div class="body" id="body-2" role="region" aria-labelledby="h-2">
        <div class="body-in"><div class="opts" id="units"></div></div>
      </div>
    </section>

    <section class="step" data-step="3">
      <h2 class="step-h">
        <button class="step-btn" type="button" id="h-3" aria-controls="body-3" aria-expanded="false">
          <span class="num">3</span>
          <span class="lab"><span class="ttl">День</span><span class="pick" id="p-day"></span></span>
          <span class="edit" aria-hidden="true">змінити</span>
        </button>
      </h2>
      <div class="body" id="body-3" role="region" aria-labelledby="h-3">
        <div class="body-in">
          <div class="cal-nav">
            <div class="cal-month" id="month" aria-live="polite"></div>
            <button class="nav" type="button" id="prev" aria-label="Попередній місяць">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button class="nav" type="button" id="next" aria-label="Наступний місяць">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
          <div class="wd" id="wd"></div>
          <div class="grid" id="days"></div>
          <div class="legend">
            <span><i class="lg-today"></i>сьогодні</span>
            <span><i class="lg-free"></i>є вільні місця</span>
            <span><i class="lg-none"></i>вільних немає</span>
          </div>
        </div>
      </div>
    </section>

    <section class="step" data-step="4">
      <h2 class="step-h">
        <button class="step-btn" type="button" id="h-4" aria-controls="body-4" aria-expanded="false">
          <span class="num">4</span>
          <span class="lab"><span class="ttl">Час</span><span class="pick" id="p-time"></span></span>
          <span class="edit" aria-hidden="true">змінити</span>
        </button>
      </h2>
      <div class="body" id="body-4" role="region" aria-labelledby="h-4">
        <div class="body-in">
          <div id="slots"></div>
          <p class="fine" id="slots-note"></p>
        </div>
      </div>
    </section>

    <section class="step" data-step="5">
      <h2 class="step-h">
        <button class="step-btn" type="button" id="h-5" aria-controls="body-5" aria-expanded="false">
          <span class="num">5</span>
          <span class="lab"><span class="ttl">Ваші дані</span><span class="pick" id="p-name"></span></span>
          <span class="edit" aria-hidden="true">змінити</span>
        </button>
      </h2>
      <div class="body" id="body-5" role="region" aria-labelledby="h-5">
        <div class="body-in">
          <div class="fields">
            <label class="field">
              <span class="flab">Ім'я</span>
              <input id="nm" placeholder="Олег" autocomplete="name" enterkeyhint="next">
              <span class="err" id="nm-err" role="alert" hidden><b aria-hidden="true">!</b><span></span></span>
            </label>
            <label class="field">
              <span class="flab">Телефон</span>
              <span class="tel"><b aria-hidden="true">+38</b><input id="ph" type="tel" inputmode="tel" placeholder="067 111 22 33" autocomplete="tel" enterkeyhint="done"></span>
              <span class="err" id="ph-err" role="alert" hidden><b aria-hidden="true">!</b><span></span></span>
            </label>
            <button class="switch" type="button" id="remind" aria-pressed="true">
              <span class="switch-txt">
                <b>Нагадати про візит</b>
                <span id="remind-sub"></span>
              </span>
              <span class="switch-track" aria-hidden="true"><i></i></span>
            </button>
          </div>
        </div>
      </div>
    </section>

    {{RIBBON}}
  </main>

  <!-- На широкому екрані підсумок стоїть збоку й нікуди не їде; на телефоні
       його роботу робить липка панель унизу. -->
  <aside class="aside" id="aside">
    <div class="aside-card">
      <div class="eyebrow">Ваш запис</div>
      <div class="aside-rows" id="aside-rows"></div>
      <div class="aside-total">
        <span>До сплати</span>
        <b id="aside-total">0 ₴</b>
      </div>
      <button class="go" id="go-wide" type="button">Далі</button>
      <p class="fine" id="aside-fine">Оплата на місці — картою або готівкою.</p>
    </div>
  </aside>

  <div class="done" id="done" hidden></div>

  <div class="sig" id="sig"></div>

</div>

<!-- Ціна й кнопка завжди під рукою: на телефоні до кінця сторінки ще їхати. -->
<div class="bar" id="cta-bar">
  <div class="bar-in">
    <div class="bar-sum">
      <b id="bar-total">—</b>
      <span id="bar-meta"></span>
    </div>
    <button class="go" id="go" type="button" disabled>Записатись</button>
  </div>
</div>

<script type="module">{{JS}}</script>
</body>
</html>
